# Provider CI workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

# Testing reads repository contents and PR patches for changed-file linting.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@fac708d6674e30b6ba41289acaab6d4b75aa0753 # v4.0.1
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@639cd343e1d3b897ff35927a75193d57cfcba299 # v3.6.0
        with:
          version: latest
          only-new-issues: true
      - name: Run Go vet
        if: github.event_name != 'pull_request'
        run: go vet ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - uses: actions/setup-go@fac708d6674e30b6ba41289acaab6d4b75aa0753 # v4.0.1
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2.0.3
        with:
          terraform_version: '1.3.*'
          terraform_wrapper: false
      - run: go generate ./...
      - name: git diff
        run: |
          if ! git diff --exit-code; then
            echo
            echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."
            exit 1
          fi

  # Run acceptance tests with OpenTofu CLI versions.
  test:
    name: OpenTofu Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LDAP_URL: ldap://localhost:1389
      LDAP_BIND_DN: cn=admin,dc=example,dc=com
      LDAP_BIND_PASSWORD: admin
    strategy:
      fail-fast: false
      matrix:
        # List supported OpenTofu versions here.
        tofu:
          - '1.12.5'
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Start LDAP test server
        run: docker compose -f ./contrib/test-ldap-server/docker-compose.yaml up -d
      - uses: actions/setup-go@fac708d6674e30b6ba41289acaab6d4b75aa0753 # v4.0.1
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.tofu }}
          tofu_wrapper: false
          provider_acceptance_tests: true
      - run: go mod download
      - env:
          TF_ACC_PROVIDER_NAMESPACE: lucidsoftware
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10
      - name: Stop LDAP test server
        if: always()
        run: docker compose -f ./contrib/test-ldap-server/docker-compose.yaml down --volumes
